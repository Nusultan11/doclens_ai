[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens-ai"
version = "0.1.0"
description = "Production-oriented document intelligence backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "boto3>=1.35,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]
eda = [
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pypdf==6.20.0",
    "python-docx==1.2.0",
]
dense = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL instance configured by TEST_DATABASE_URL",
    "storage: requires a real S3-compatible service configured by TEST_S3_* variables",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
