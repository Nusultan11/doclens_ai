# Combine with compose.yaml AND compose.search.yaml. No generator service/model downloads.
services:
  api:
    environment:
      RAG_ENABLED: "true"
      RAG_ENDPOINT: ${RAG_ENDPOINT:-}
      RAG_MODEL_ID: ${RAG_MODEL_ID:-}
      RAG_MODEL_REVISION: ${RAG_MODEL_REVISION:-}
      RAG_ARTIFACT_SHA256: ${RAG_ARTIFACT_SHA256:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_TEMPERATURE: ${RAG_TEMPERATURE:-0}
      RAG_MAX_OUTPUT_TOKENS: ${RAG_MAX_OUTPUT_TOKENS:-1024}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-60}
      RAG_CONCURRENCY: ${RAG_CONCURRENCY:-1}
