services:
  api:
    build:
      context: .
    environment:
      APP_NAME: DocLens AI
      DATABASE_URL: postgresql+asyncpg://doclens:doclens-local@postgres:5432/doclens
      ENVIRONMENT: local
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doclens
      POSTGRES_PASSWORD: doclens-local
      POSTGRES_USER: doclens
    ports:
      - "5432:5432"
    volumes:
      - doclens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclens -d doclens"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  doclens-postgres-data:
